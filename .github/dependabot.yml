version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "Asia/Dhaka"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - backend
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "Asia/Dhaka"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - frontend
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - ci